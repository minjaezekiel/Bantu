<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<title>Bantu Talk</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
</head>
<body>

<!-- ───────────────────────── join ───────────────────────── -->
<dialog id="joinDialog" class="dialog" aria-labelledby="joinTitle">
  <form id="joinForm" method="dialog" class="dialog-card">
    <h1 id="joinTitle" class="dialog-title">Bantu&nbsp;Talk</h1>
    <p class="dialog-sub">Messaging, voice and video over WebRTC — signalled by a Bantu server.</p>
    <label class="field">
      <span class="field-label">Your display name</span>
      <input id="joinName" class="input" type="text" maxlength="24" required
             autocomplete="nickname" placeholder="e.g. Ezekiel" value="">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Join</button>
    <p id="joinHint" class="dialog-hint"></p>
  </form>
</dialog>

<!-- ───────────────────── incoming call ──────────────────── -->
<dialog id="ringDialog" class="dialog" aria-labelledby="ringTitle">
  <div class="dialog-card ring-card">
    <div class="ring-avatar" id="ringAvatar" aria-hidden="true">?</div>
    <h2 id="ringTitle" class="dialog-title">
      <span id="ringName">Someone</span>
    </h2>
    <p class="dialog-sub" id="ringKind">is calling you</p>
    <div class="ring-actions">
      <button class="btn btn-danger" id="ringDecline" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M21 15.5v3a2 2 0 01-2.2 2 19 19 0 01-8.3-3 19 19 0 01-3-3A19 19 0 014.5 5.2 2 2 0 016.5 3h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.6a2 2 0 01-.5 2.1l-1.3 1.3a15 15 0 005.9 5.9l1.3-1.3a2 2 0 012.1-.5c.8.3 1.7.6 2.6.7a2 2 0 011.7 2z"/></svg>
        Decline
      </button>
      <button class="btn btn-accept" id="ringAccept" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15.5v3a2 2 0 01-2.2 2 19 19 0 01-8.3-3 19 19 0 01-3-3A19 19 0 014.5 5.2 2 2 0 016.5 3h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.6a2 2 0 01-.5 2.1l-1.3 1.3a15 15 0 005.9 5.9l1.3-1.3a2 2 0 012.1-.5c.8.3 1.7.6 2.6.7a2 2 0 011.7 2z"/></svg>
        Accept
      </button>
    </div>
  </div>
</dialog>

<!-- ───────────────────────── app ───────────────────────── -->
<div class="app">

  <header class="topbar">
    <button class="icon-btn only-narrow" id="rosterToggle" type="button"
            aria-label="Show who is online" aria-expanded="false" aria-controls="roster">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Bantu&nbsp;Talk</span>
    </div>

    <div class="topbar-right">
      <span class="status" id="status" role="status">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusText">connecting…</span>
      </span>
      <span class="self-chip" id="selfChip" hidden></span>
    </div>
  </header>

  <p class="banner" id="banner" role="alert" hidden></p>

  <div class="body">

    <!-- roster -->
    <aside class="roster" id="roster" aria-label="People online">
      <div class="roster-head">
        <h2 class="roster-title">Online <span class="count" id="onlineCount">0</span></h2>
        <button class="icon-btn only-narrow" id="rosterClose" type="button" aria-label="Close list">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul class="peer-list" id="peerList"></ul>
      <p class="roster-empty" id="rosterEmpty">
        Nobody else yet. Open this page in a second browser window, or on your phone, to pair up.
      </p>
      <div class="roster-foot">
        <p class="foot-label">This page</p>
        <code class="foot-url" id="shareUrl">—</code>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- conversation -->
    <main class="chat">

      <!-- call stage: absent entirely until a call exists -->
      <section class="stage" id="stage" hidden aria-label="Call">
        <div class="stage-media">
          <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
          <div class="voice-face" id="voiceFace" hidden>
            <div class="voice-avatar" id="voiceAvatar" aria-hidden="true">?</div>
            <p class="voice-name" id="voicePeer">—</p>
            <div class="level" id="level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <video class="local-video" id="localVideo" autoplay playsinline muted></video>
          <button class="btn btn-small tap-audio" id="tapAudio" type="button" hidden>
            Tap to enable sound
          </button>
        </div>
        <div class="stage-bar">
          <div class="stage-meta">
            <span class="stage-peer" id="stagePeer">—</span>
            <span class="stage-state" id="stageState">connecting…</span>
          </div>
          <div class="stage-controls">
            <button class="icon-btn round" id="btnMute" type="button" aria-pressed="false" aria-label="Mute microphone">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v4"/></svg>
            </button>
            <button class="icon-btn round" id="btnCam" type="button" aria-pressed="false" aria-label="Turn camera off">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7h11v10H2zM13 11l7-4v10l-7-4z"/></svg>
            </button>
            <button class="icon-btn round danger" id="btnHangup" type="button" aria-label="Hang up">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M21 15.5v3a2 2 0 01-2.2 2 19 19 0 01-8.3-3 19 19 0 01-3-3A19 19 0 014.5 5.2 2 2 0 016.5 3h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.6a2 2 0 01-.5 2.1l-1.3 1.3a15 15 0 005.9 5.9l1.3-1.3a2 2 0 012.1-.5c.8.3 1.7.6 2.6.7a2 2 0 011.7 2z"/></svg>
            </button>
          </div>
        </div>
      </section>

      <ol class="messages" id="messages" aria-live="polite" aria-label="Messages" tabindex="0"></ol>

      <form class="composer" id="composer" autocomplete="off">
        <button class="dm-badge" id="dmBadge" type="button" hidden>
          <span id="dmBadgeText">room</span>
          <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <label class="sr-only" for="text">Message</label>
        <input class="input composer-input" id="text" type="text" maxlength="2000"
               placeholder="Write a message…" enterkeyhint="send">
        <button class="icon-btn round primary" id="btnSend" type="submit" aria-label="Send message">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z"/></svg>
        </button>
      </form>

    </main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
